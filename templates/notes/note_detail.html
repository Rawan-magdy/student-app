{% extends 'base.html' %}
{% block content %}
<h3>{{ note.title }}</h3>
{% if note.category %}<span class="badge bg-info">{{ note.category.name }}</span>{% endif %}
<p class="mt-3">{{ note.content|linebreaks }}</p>
<div class="mb-3">
  {% for tag in note.tags.all %}<span class="badge bg-secondary">#{{ tag.name }}</span>{% endfor %}
</div>
<small class="text-muted">Created: {{ note.created_at|date:"d M Y" }}</small><br>
<a href="{% url 'note_list' %}" class="btn btn-secondary mt-3">Back</a>
{% endblock %}
