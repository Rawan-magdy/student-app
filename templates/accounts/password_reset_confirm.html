{% extends 'base.html' %}
{% block auth_content %}
{% if validlink %}
  <h4 class="mb-3 text-center">Set New Password</h4>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary w-100">Change password</button>
  </form>
{% else %}
  <div class="alert alert-danger">This reset link is invalid or expired.</div>
  <a href="{% url 'password_reset' %}" class="btn btn-primary w-100">Try again</a>
{% endif %}
{% endblock %}
