{% extends 'base.html' %}
{% block auth_content %}
<h4 class="mb-3 text-center">Login</h4>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary w-100">Login</button>
</form>
<p class="mt-3 text-center"><a href="{% url 'password_reset' %}">Forgot password?</a></p>
<p class="text-center">No account? <a href="{% url 'register' %}">Register</a></p>
{% endblock %}
