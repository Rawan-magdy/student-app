{% extends 'base.html' %}
{% block auth_content %}
<h4 class="mb-3 text-center">Create Account</h4>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary w-100">Register</button>
</form>
<p class="mt-3 text-center">Already have an account? <a href="{% url 'login' %}">Login</a></p>
{% endblock %}
