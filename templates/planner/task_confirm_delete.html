{% extends 'base.html' %}
{% block content %}
<div class="alert alert-danger">
  Are you sure you want to delete "<strong>{{ task.title }}</strong>"?
</div>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'task_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
